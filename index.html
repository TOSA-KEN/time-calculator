<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fc">
  <meta name="apple-mobile-web-app-title" content="滞在時間計算">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; form-action 'none'; object-src 'none'; base-uri 'none'">
  <title>滞在時間計算</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/180.png">
  <link rel="icon" href="./icons/192.png">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <main>
    <header>
      <img src="./icons/192.png" width="44" height="44" alt="">
      <h1>滞在時間計算</h1>
    </header>
    <div class="layout">
      <section class="summary" aria-label="時刻と計算結果">
        <div class="times" role="group" aria-label="入力する時刻を選択">
          <button class="time" id="start" type="button" aria-pressed="true"><span>開始時刻</span><strong>--:--</strong></button>
          <button class="time" id="end" type="button" aria-pressed="false"><span>終了時刻</span><strong>--:--</strong></button>
        </div>
        <p id="hint" aria-live="polite">テンキーで時刻を4桁入力</p>
        <div class="result">
          <span>滞在時間</span>
          <output aria-label="滞在時間"><strong id="minutes">—</strong><span>分</span></output>
          <div id="detail"></div>
        </div>
      </section>
      <section class="controls" aria-label="時刻入力">
        <div class="keys" role="group" aria-label="テンキー">
          <button type="button" data-digit="1">1</button>
          <button type="button" data-digit="2">2</button>
          <button type="button" data-digit="3">3</button>
          <button type="button" data-digit="4">4</button>
          <button type="button" data-digit="5">5</button>
          <button type="button" data-digit="6">6</button>
          <button type="button" data-digit="7">7</button>
          <button type="button" data-digit="8">8</button>
          <button type="button" data-digit="9">9</button>
          <button type="button" id="double-zero">00</button>
          <button type="button" data-digit="0">0</button>
          <button type="button" id="back" aria-label="1桁削除">⌫</button>
        </div>
        <div class="actions">
          <button type="button" id="now">現在時刻</button>
          <button type="button" id="clear">クリア</button>
        </div>
      </section>
    </div>
    <footer id="offline" role="status"></footer>
  </main>
</body>
</html>
