<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7da">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="はじめの８チャン">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
  <title>はじめの８チャン</title>
</head>
<body>
  <div class="shell">
    <header>
      <img src="./icon.svg" alt="" width="44" height="44">
      <div><p>ハチハチ倶楽部</p><h1>はじめの８チャン</h1></div>
    </header>
    <main>
      <section class="display" aria-label="時刻">
        <div class="panel arrival">
          <span>入店時刻</span>
          <strong id="input">--:--</strong>
        </div>
        <div class="panel result">
          <span>初回40分 終了時刻</span>
          <output id="output" aria-label="初回40分終了時刻">--:--</output>
        </div>
        <p id="hint" aria-live="polite">テンキーで時刻を4桁入力</p>
      </section>
      <section class="controls" aria-label="時刻入力">
        <div class="keys" id="keys" role="group" aria-label="テンキー">
          <button type="button" data-digit="1">1</button>
          <button type="button" data-digit="2">2</button>
          <button type="button" data-digit="3">3</button>
          <button type="button" data-digit="4">4</button>
          <button type="button" data-digit="5">5</button>
          <button type="button" data-digit="6">6</button>
          <button type="button" data-digit="7">7</button>
          <button type="button" data-digit="8">8</button>
          <button type="button" data-digit="9">9</button>
          <button type="button" data-digit="00">00</button>
          <button type="button" data-digit="0">0</button>
          <button type="button" id="back" aria-label="1桁削除">⌫</button>
        </div>
        <div class="actions">
          <button type="button" class="now" id="now">現在時刻</button>
          <button type="button" id="clear">クリア</button>
        </div>
        <p id="status" role="status"></p>
      </section>
    </main>
  </div>
</body>
</html>
