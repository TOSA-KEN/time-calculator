<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7da"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon.svg"><title>はじめの８チャン</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7da;color:#242017;font-family:system-ui,sans-serif;padding:16px;max-width:1000px;margin:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:16px}header b{font-size:38px;background:#ffce3c;border-radius:16px;padding:3px 16px}h1{font-size:clamp(24px,5vw,36px);margin:0}small{font-weight:bold}main{display:grid;gap:12px}.display{display:grid;gap:12px;align-content:start}.panel{border:1px solid #e4ce92;border-radius:16px;padding:18px;background:#fffdf5}.panel strong{display:block;font-size:clamp(48px,12vw,82px);font-variant-numeric:tabular-nums;line-height:1.3}.result{background:#242017;color:#ffda55}.result label{color:white}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{font:inherit;font-size:28px;font-weight:800;border:1px solid #e4ce92;border-radius:12px;background:#fffdf5;color:#242017;min-height:62px;touch-action:manipulation;cursor:pointer}button:active{background:#ffce3c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.actions button{font-size:18px;min-height:48px}.now{background:#ffce3c;border-color:#242017}#status{text-align:right;font-size:12px;margin-top:8px}#hint{font-size:15px;min-height:22px;margin:0}@media(min-width:700px){main{grid-template-columns:1fr 1fr}.panel strong{font-size:64px}.keys button{min-height:65px}} </style><header><b>8</b><div><small>ハチハチ倶楽部</small><h1>はじめの８チャン</h1></div></header><main><section class="display"><div class="panel"><label>入店時刻</label><strong id="input">--:--</strong></div><div class="panel result"><label>初回40分 終了時刻</label><strong id="output" aria-live="polite">--:--</strong></div><p id="hint">テンキーで時刻を4桁入力</p></section><section><div class="keys" id="keys"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>00</button><button>0</button><button aria-label="1桁削除">⌫</button></div><div class="actions"><button class="now" id="now">現在時刻</button><button id="clear">クリア</button></div><div id="status">オンライン利用</div></section></main><script>
let digits='';const el=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
function render(){let s=digits.padEnd(4,'-');el('input').textContent=s.slice(0,2)+':'+s.slice(2);el('output').textContent='--:--';el('hint').textContent='テンキーで時刻を4桁入力';if(digits.length!==4)return;let h=+digits.slice(0,2),m=+digits.slice(2);if(h>47||m>59){el('hint').textContent='正しい時刻を入力してください';return}let t=h*60+m+40;el('output').textContent=pad(Math.floor(t/60))+':'+pad(t%60);el('hint').textContent='入店時刻から40分後';}
el('keys').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;let k=e.target.textContent;if(k==='⌫')digits=digits.slice(0,-1);else digits=((digits.length===4?'':digits)+k).slice(0,4);render()});el('clear').onclick=()=>{digits='';render()};el('now').onclick=()=>{let d=new Date();digits=pad(d.getHours())+pad(d.getMinutes());render()};if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>el('status').textContent='オフライン利用可').catch(()=>el('status').textContent='オフライン準備未完了')}
</script></html>
